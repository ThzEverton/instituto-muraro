name: CI - Frontend e Backend
on:
  push:
    branches: [main, develop, qa]
  pull_request:
    branches: [main, develop, qa]
permissions:
  contents: read
jobs:
  quality:
    name: TypeScript, build e testes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: "12.3.4"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - name: Instalar dependências
        run: pnpm install --frozen-lockfile
      - name: Tipagem frontend
        run: pnpm exec tsc --noEmit
      - name: Build frontend
        run: pnpm build
      - name: Regras demo
        run: pnpm exec tsx scripts/verify-demo.ts
      - name: Build backend
        run: pnpm --dir backend build
      - name: Testes backend
        run: pnpm --dir backend test
