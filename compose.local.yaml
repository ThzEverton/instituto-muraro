services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: instituto_muraro
      POSTGRES_USER: muraro
      POSTGRES_PASSWORD: desenvolvimento_local_alterar
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - muraro_postgres_local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U muraro -d instituto_muraro"]
      interval: 5s
      retries: 10

volumes:
  muraro_postgres_local:
